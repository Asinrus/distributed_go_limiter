name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Without this the go-version pin below is not enforced: the toolchain
      # silently upgrades to whatever go.mod/go.work declare, and that upgrade
      # once let stdlib CVEs past this workflow.
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # Every go.mod and go.work says go 1.25.0; with GOTOOLCHAIN=local a pin
          # below that is a hard build failure. 1.25.14 is the current 1.25.x
          # patch, carrying the fixes for GO-2026-6090 (crypto/tls) and
          # GO-2026-5972 (encoding/asn1).
          go-version: "1.25.14"

      - name: Discover modules
        id: modules
        run: |
          MODULES="$(go list -f '{{.Dir}}' -m)"
          echo "Discovered modules:"
          echo "$MODULES"
          CORE="$(printf '%s\n' "$MODULES" | grep '/core$')"
          OTHERS="$(printf '%s\n' "$MODULES" | grep -v '/core$')"
          {
            echo "core=$CORE"
            echo "others<<EOF"
            echo "$OTHERS"
            echo "EOF"
            echo "modules<<EOF"
            echo "$MODULES"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Test core (-race)
        working-directory: ${{ env.core }}
        run: |
          go vet ./...
          go test -race ./...

      - name: Test remaining modules
        run: |
          FAILED=0
          while IFS= read -r dir; do
            [ -n "$dir" ] || continue
            echo "== $dir =="
            (cd "$dir" && go vet ./... && go test ./...) || FAILED=1
          done <<< "$others"
          exit "$FAILED"

      - name: gofmt
        run: |
          UNFORMATTED="$(gofmt -l .)"
          if [ -n "$UNFORMATTED" ]; then
            echo "gofmt found unformatted files:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: govulncheck
        run: |
          # v1.8.0+ requires go >= 1.26.0, which the pin above doesn't provide.
          # v1.7.0 is the newest release that builds and runs under 1.25.x;
          # bump this once go-version above moves to 1.26+.
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          FAILED=0
          while IFS= read -r dir; do
            [ -n "$dir" ] || continue
            echo "== $dir =="
            (cd "$dir" && govulncheck ./...) || FAILED=1
          done <<< "$modules"
          exit "$FAILED"
