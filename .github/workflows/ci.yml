name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Without this the go-version pin below is not enforced: the toolchain
      # silently upgrades to whatever go.mod/go.work declare, and that upgrade
      # once let stdlib CVEs past this workflow.
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # GOTOOLCHAIN=local makes this pin real. It tracks the newest patch
          # release because govulncheck reports stdlib vulnerabilities against the
          # building toolchain; the go directive stays at the dependency floor (ADR 0017).
          go-version: "1.26.9"

      - name: Discover modules
        id: modules
        run: |
          MODULES="$(go list -f '{{.Dir}}' -m)"
          echo "Discovered modules:"
          echo "$MODULES"
          CORE="$(printf '%s\n' "$MODULES" | grep '/core$')"
          OTHERS="$(printf '%s\n' "$MODULES" | grep -v '/core$')"
          {
            echo "core=$CORE"
            echo "others<<EOF"
            echo "$OTHERS"
            echo "EOF"
            echo "modules<<EOF"
            echo "$MODULES"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Test core (-race)
        working-directory: ${{ env.core }}
        run: |
          go vet ./...
          go test -race ./...

      - name: Test remaining modules
        run: |
          FAILED=0
          while IFS= read -r dir; do
            [ -n "$dir" ] || continue
            echo "== $dir =="
            (cd "$dir" && go vet ./... && go test ./...) || FAILED=1
          done <<< "$others"
          exit "$FAILED"

      - name: gofmt
        run: |
          UNFORMATTED="$(gofmt -l .)"
          if [ -n "$UNFORMATTED" ]; then
            echo "gofmt found unformatted files:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          FAILED=0
          while IFS= read -r dir; do
            [ -n "$dir" ] || continue
            echo "== $dir =="
            (cd "$dir" && govulncheck ./...) || FAILED=1
          done <<< "$modules"
          exit "$FAILED"
