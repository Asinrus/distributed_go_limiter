services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.16
    ports:
      - "2379:2379"
    command:
      - etcd
      - --listen-client-urls
      - http://0.0.0.0:2379
      - --advertise-client-urls
      - http://0.0.0.0:2379
    healthcheck:
      test: ["CMD", "etcdctl", "--endpoints=http://localhost:2379", "endpoint", "health"]
      interval: 2s
      timeout: 2s
      retries: 15
